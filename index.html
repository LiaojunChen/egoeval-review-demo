function esc(v){return String(v??'').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));}
function level(record){return record?.level||(record?.status==='proxy'?'PX':(record?.status==='unavailable'||record?.status==='error'?'NA':'-'));}
function levelClass(v){return v==='NA'?'':`level-${v}`;}
function current(){return PAYLOAD.episodes[state.index]||PAYLOAD.episodes[0];}
const episodeCache=new Map(); let renderToken=0;
async function loadEpisode(summary){if(!summary?.detail_url)return summary;let pending=episodeCache.get(summary.detail_url);if(!pending){pending=fetch(summary.detail_url,{cache:'force-cache'}).then(response=>{if(!response.ok)throw new Error(`HTTP ${response.status}`);return response.json();});episodeCache.set(summary.detail_url,pending);}return pending;}
function renderLoading(e){const main=document.getElementById('mainContent');const scores=document.getElementById('scoreList');if(main)main.innerHTML=`<div class="episode-header"><div><div class="eyebrow">${esc(e?.source||'eval')}</div><h1>${esc(e?.episode_id||'')}</h1><div class="task">正在加载该 episode 的证据与评级数据...</div></div></div>`;if(scores)scores.innerHTML='<div class="score-empty">正在加载评级矩阵...</div>';}
function pct(v){const n=Number(v);return Number.isFinite(n)?`${n.toFixed(2).replace(/0+$/,'').replace(/\.$/,'')}%`:'-';}
function auditText(match){const fallback=`倒数 ${pct(match.percentile_start)}-${pct(match.percentile_end)}`;const label=match.selection_label||fallback;return `${match.metric_id} · ${label} · 质量百分位 ${pct(match.quality_percentile)} · 值 ${fmt(match.value,4)}${match.level?` · ${match.level}`:''}`;}
function auditMatches(e){return Array.isArray(e.audit_matches)?e.audit_matches:[];}
function auditSelections(){const selections=PAYLOAD.audit_selection?.selections;return Array.isArray(selections)?selections:[];}
function auditSelectionKey(selection){if(selection?.selection_id)return selection.selection_id;return `percentile_${Number(selection?.percentile_start)}_${Number(selection?.percentile_end)}`;}
function selectedAudit(){return auditSelections().find(item=>item.metric_id===state.auditMetric&&auditSelectionKey(item)===state.auditSelection)||null;}
function selectionMatch(match,selection){if(!selection||match.metric_id!==selection.metric_id)return false;if(selection.selection_id)return match.selection_id===selection.selection_id;return Number(match.percentile_start)===Number(selection.percentile_start)&&Number(match.percentile_end)===Number(selection.percentile_end);}
function activeAuditMatches(e){const selection=selectedAudit();const matches=auditMatches(e);return selection?matches.filter(match=>selectionMatch(match,selection)):matches;}
function auditQueueTitle(){const selection=selectedAudit();if(!selection)return PAYLOAD.audit_selection?'质量审计 Episodes':'待评级 Episodes';return `${selection.metric_id} ${selection.metric_name} · ${selection.selection_label||'质量审计'}`;}
function filteredEpisodes(){const selection=selectedAudit();return PAYLOAD.episodes.filter(e=>{if(auditSelections().length&&!activeAuditMatches(e).length)return false;const text=(e.episode_id+' '+e.task).toLowerCase(); if(state.query&&!text.includes(state.query.toLowerCase())) return false; if(state.filter==='low'&&!['L3','L4'].includes(e.overall_level)) return false; if(state.filter==='missing'&&!e.low_metrics.some(m=>m.status==='unavailable')) return false; return true;});}
function refreshAuditCategoryControl(){const metricSelect=document.getElementById('auditMetricFilter');const categorySelect=document.getElementById('auditCategoryFilter');const choices=auditSelections().filter(item=>item.metric_id===state.auditMetric);if(!choices.length)return;const valid=choices.some(item=>auditSelectionKey(item)===state.auditSelection);if(!valid)state.auditSelection=auditSelectionKey(choices[0]);categorySelect.innerHTML=choices.map(item=>{const key=auditSelectionKey(item);const eligible=item.category_eligible_count??item.selected_count;const shortfall=item.shortfall?`，缺 ${item.shortfall}`:' ';return `<option value="${esc(key)}">${esc(item.selection_label||key)}（${item.selected_count} / ${eligible} 条${shortfall}）</option>`;}).join('');metricSelect.value=state.auditMetric;categorySelect.value=state.auditSelection;}
function initializeAuditControls(){const selections=auditSelections();if(!selections.length)return;const controls=document.getElementById('auditControls');const metricSelect=document.getElementById('auditMetricFilter');const seen=new Set();const metrics=selections.filter(item=>{if(seen.has(item.metric_id))return false;seen.add(item.metric_id);return true;});if(!metrics.some(item=>item.metric_id===state.auditMetric))state.auditMetric=metrics[0].metric_id;metricSelect.innerHTML=metrics.map(item=>`<option value="${esc(item.metric_id)}">${esc(item.metric_id)} · ${esc(item.metric_name)}</option>`).join('');refreshAuditCategoryControl();controls.hidden=false;metricSelect.onchange=event=>{state.auditMetric=event.target.value;state.auditSelection=null;state.metric=state.auditMetric;refreshAuditCategoryControl();render();};document.getElementById('auditCategoryFilter').onchange=event=>{state.auditSelection=event.target.value;state.metric=state.auditMetric;render();};state.metric=state.auditMetric;}
function renderEpisodes(){const list=document.getElementById('episodeList'); const rows=filteredEpisodes(); const selection=selectedAudit(); document.getElementById('queueHeading').textContent=auditQueueTitle(); const eligible=selection?.category_eligible_count??selection?.selected_count; document.getElementById('queueCount').textContent=selection?`${rows.length} / ${selection.selected_count} 条 · 类别可用 ${eligible} 条`: `${rows.length} 条 · 已加载 ${PAYLOAD.episodes.length} 条`; if(rows.length&&!rows.includes(current())) state.index=PAYLOAD.episodes.indexOf(rows[0]); list.innerHTML=rows.map(e=>{const index=PAYLOAD.episodes.indexOf(e); const l=e.overall_level||'-';const audit=activeAuditMatches(e);const auditLine=audit.length?`<div class="episode-task" title="${esc(audit.map(auditText).join('；'))}">${esc(audit.map(auditText).join('；'))}</div>`:'';return `<button class="episode ${index===state.index?'active':''}" data-index="${index}"><div class="episode-line"><span class="episode-id">${esc(e.episode_id)}</span><b class="${levelClass(l)}">${esc(l)}</b></div><div class="episode-task">${esc(e.task||'未提供指令')}</div>${auditLine}</button>`;}).join('')||'<div class="score-empty">没有匹配的 episode</div>'; list.querySelectorAll('.episode').forEach(b=>b.onclick=()=>{state.index=Number(b.dataset.index); state.metric=state.auditMetric||null; render();});}
function fmt(v, digits=3){if(v===null||v===undefined||Number.isNaN(Number(v)))return '-'; const n=Number(v); return Math.abs(n)>=1000?n.toExponential(2):n.toFixed(digits).replace(/0+$/,'').replace(/\.$/,'');}
function metricRecords(e){return e.metrics||[];}
function lowMetrics(e){return [...e.low_metrics].sort((a,b)=>{const rank=x=>x.status==='proxy'?1:(x.status==='unavailable'||x.status==='error'?1.5:(LEVEL_ORDER[x.level]??-1)); return rank(b)-rank(a);});}
function chartSvg(series, options={}){const W=900,H=240,p={l:44,r:14,t:18,b:29}, iw=W-p.l-p.r, ih=H-p.t-p.b; const all=series.flatMap(s=>(s.values||[]).filter(v=>v!==null&&Number.isFinite(Number(v))).map(Number)); if(!all.length)return `<svg viewBox="0 0 ${W} ${H}"><text x="${W/2}" y="${H/2}" fill="#91a0af" text-anchor="middle">暂无可用序列</text></svg>`; let lo=options.min??Math.min(...all), hi=options.max??Math.max(...all); if(hi===lo){hi=lo+1;} const x=i=>p.l+(i/Math.max(1,(series[0]?.values?.length||2)-1))*iw; const y=v=>p.t+(hi-v)/(hi-lo)*ih; let out=`<svg viewBox="0 0 ${W} ${H}" role="img" data-chart="evidence"><rect width="100%" height="100%" fill="#0b141d"/>`; for(let i=0;i<5;i++){const yy=p.t+i*ih/4; const val=hi-i*(hi-lo)/4; out+=`<line x1="${p.l}" y1="${yy}" x2="${W-p.r}" y2="${yy}" stroke="#233444"/><text x="${p.l-8}" y="${yy+4}" fill="#718191" font-size="10" text-anchor="end">${fmt(val,2)}</text>`;} const bad=options.bad||[]; bad.forEach((range)=>{const x1=p.l+(range[0]/Math.max(1,(series[0]?.values?.length||2)-1))*iw; const x2=p.l+(range[1]/Math.max(1,(series[0]?.values?.length||2)-1))*iw; out+=`<rect x="${x1}" y="${p.t}" width="${Math.max(2,x2-x1)}" height="${ih}" fill="#c93b45" opacity=".13"/>`;}); (options.thresholds||[]).forEach(t=>{if(t.value<lo||t.value>hi)return; const yy=y(t.value); out+=`<line x1="${p.l}" y1="${yy}" x2="${W-p.r}" y2="${yy}" stroke="${t.color||'#e8b659'}" stroke-dasharray="5 4"/><text x="${W-p.r-2}" y="${yy-5}" fill="${t.color||'#e8b659'}" font-size="10" text-anchor="end">${esc(t.label||fmt(t.value))}</text>`;}); series.forEach((s,si)=>{const vals=s.values||[]; let d=''; vals.forEach((v,i)=>{if(v===null||v===undefined||!Number.isFinite(Number(v)))return; d+=(d?'L':'M')+` ${x(i).toFixed(1)} ${y(Number(v)).toFixed(1)}`;}); out+=`<path d="${d}" fill="none" stroke="${s.color||['#62b0ff','#ee6a79','#57c99b','#e8b659'][si%4]}" stroke-width="${s.width||2}" stroke-linejoin="round"/>`;}); out+=`<line class="evidence-playhead" x1="${p.l}" y1="${p.t}" x2="${p.l}" y2="${p.t+ih}"/><text x="${p.l}" y="${H-7}" fill="#718191" font-size="10">起始</text><text x="${W-p.r}" y="${H-7}" fill="#718191" font-size="10" text-anchor="end">结束</text></svg>`; return out;}
function legend(series){return `<div class="legend">${series.map(s=>`<span><i style="background:${s.color}"></i>${esc(s.label)}</span>`).join('')}</div>`;}
function normalizeSeries(series){return series.map(s=>{const values=(s.values||[]).filter(v=>v!==null&&Number.isFinite(Number(v))).map(Number); const lo=values.length?Math.min(...values):0, hi=values.length?Math.max(...values):1; return {...s,label:s.label+'（归一化）',values:(s.values||[]).map(v=>v===null?null:(Number(v)-lo)/Math.max(hi-lo,1e-9)),rawMin:lo,rawMax:hi};});}
function booleanRanges(values,predicate){const out=[]; let start=null; values.forEach((v,i)=>{const bad=v!==null&&Number.isFinite(Number(v))&&predicate(Number(v)); if(bad&&start===null)start=i; if(!bad&&start!==null){out.push([start,i]);start=null;}}); if(start!==null)out.push([start,values.length]); return out;}
function rangesFromDetails(details,key,length){const ranges=details?.[key]; if(!Array.isArray(ranges))return []; return ranges.map(r=>[Math.max(0,Number(r[0]||0)),Math.min(length,Number(r[1]||0))]);}
function evidenceFor(e,m){const s=e.evidence?.signals||{}, d=m.details||{}, id=m.metric_id; let series=[], thresholds=[], bad=[]; const add=(key,label,color)=>series.push({values:s[key]||[],label,color}); if(id==='V1'){add('laplacian','Laplacian 清晰度','#62b0ff'); const t=Number(d.threshold||41.2865); thresholds.push({value:t,label:`模糊阈值 ${fmt(t,1)}`,color:'#ee6a79'}); bad=rangesFromDetails(d,'blur_ranges',(s.laplacian||[]).length); if(!bad.length)bad=booleanRanges(s.laplacian||[],v=>v<t);} else if(id==='V2'){add('displacement','光流位移 px','#ee6a79'); const t=Number(d.threshold_px||34.9); thresholds.push({value:t,label:'位移阈值',color:'#e8b659'}); bad=rangesFromDetails(d,'tracking_failure_ranges',(s.displacement||[]).length); if(!bad.length)bad=booleanRanges(s.displacement||[],v=>v>t);} else if(id==='M1'){add('camera_speed','相机速度','#e8b659'); add('left_speed','左腕速度','#62b0ff'); add('right_speed','右腕速度','#ee6a79'); thresholds.push({value:.2,label:'相机平移阈值',color:'#e8b659'});} else if(id==='M2'){add('state_motion','状态速度','#62b0ff'); add('acceleration','加速度','#ee6a79');} else if(id==='M3'){add('continuity','轨迹连续性残差','#ee6a79'); add('left_speed','左腕速度','#62b0ff'); add('right_speed','右腕速度','#57c99b');} else if(id==='M4'){add('state_motion','状态运动','#62b0ff'); add('visual_energy','视频运动能量','#57c99b');} else if(id==='C2'){add('left_confidence','左手置信度','#62b0ff'); add('right_confidence','右手置信度','#ee6a79'); const t=Number(d.valid_hand_confidence||.1); thresholds.push({value:t,label:'有效帧阈值',color:'#e8b659'}); bad=booleanRanges((s.left_confidence||[]).map((v,i)=>Math.min(v??1,(s.right_confidence||[])[i]??1)),v=>v<t);} else if(id==='X2'||id==='X2P'){add('state_motion','状态运动','#62b0ff'); add('visual_energy','视频运动能量','#ee6a79');} else if(id==='X3'){add('timestamp_delta','时间戳间隔','#62b0ff'); thresholds.push({value:1/(e.evidence?.fps||30),label:'期望间隔',color:'#57c99b'});} if(['M4','X2','X2P'].includes(id)) series=normalizeSeries(series); return {series,thresholds,bad};}
function detailGrid(m){const entries=[]; const walk=(v,prefix='')=>{Object.entries(v||{}).forEach(([k,value])=>{const key=prefix?prefix+'.'+k:k; if(value&&typeof value==='object'&&!Array.isArray(value))walk(value,key); else if(!Array.isArray(value)||value.length<=6)entries.push([key,Array.isArray(value)?value.join(', '):value]);});}; walk(m.details||{}); return entries.length?`<div class="detail-grid">${entries.slice(0,10).map(([k,v])=>`<div class="detail"><label>${esc(k.replaceAll('_',' '))}</label><span>${esc(typeof v==='number'?fmt(v,4):String(v??'-'))}</span></div>`).join('')}</div>`:'';}
function renderEvidence(e,m){const id=m.metric_id; const spec=PAYLOAD.metric_specs[id]||{name:m.name,description:''}; const unavailable=m.status==='unavailable'||m.status==='error'; let body=''; if(id==='X1'||id==='C1'||id==='S0.semantic'||id==='S0.task') body=`<div class="instruction"><div class="instruction-box"><h3>Instruction / 指令</h3><p>${esc(e.task||'未提供指令')}</p></div><div class="instruction-box"><h3>Video / 视频</h3><p style="color:#91a0af">播放上方视频，逐项核对动作、对象、目标、方向、顺序和结果。</p></div></div>`; else if(id==='S0.fps'||id==='S0.timeline'){const chart={series:[{values:e.evidence?.signals?.timestamp_delta||[],label:'时间戳间隔',color:'#62b0ff'}],thresholds:[{value:1/(e.evidence?.fps||30),label:'期望帧间隔',color:'#57c99b'}]}; body=`<div class="chart-wrap">${chartSvg(chart.series,{thresholds:chart.thresholds})}${legend(chart.series)}</div>${detailGrid(m)}`;} else if(id.startsWith('S0.')) body=`<div class="evidence-note ${unavailable?'bad':'good'}">${esc(m.reason||spec.description||'硬门检查结果来自 schema / metadata / 视频探针。')}</div>${detailGrid(m)}`; else {const chart=evidenceFor(e,m); body=`<div class="chart-wrap">${chartSvg(chart.series,{thresholds:chart.thresholds,bad:chart.bad})}${legend(chart.series)}</div>${detailGrid(m)}`;} const note=unavailable?`<div class="evidence-note">该指标当前为 unavailable：${esc(m.reason||'缺少正式证据')}。图表仅展示可用于人工复核的原始信号，不改变正式评级。</div>`:m.status==='proxy'?`<div class="evidence-note">代理诊断：${esc(m.reason||'该结果不参与正式等级和总分。')}</div>`:m.level==='L3'||m.level==='L4'?`<div class="evidence-note bad">低分证据：${esc(m.reason||spec.description||'请结合红色区段与阈值线复核。')}</div>`:`<div class="evidence-note good">该指标没有形成低分短板，可用图表做快速复核。</div>`; return `<div class="evidence-title"><div><h2>${esc(id)} · ${esc(m.name||spec.name)}</h2><p>${esc(spec.description||'')} </p></div><b class="${levelClass(level(m))}">${esc(level(m))}</b></div><div class="evidence-body">${body}${note}</div>`;}
function metricStrip(e){return lowMetrics(e).map(x=>`<button class="metric-chip ${state.metric===x.metric_id?'active':''}" data-metric="${esc(x.metric_id)}"><span class="chip-id">${esc(x.metric_id)}</span><span class="chip-name">${esc(x.name||'')}</span><b class="${levelClass(level(x))}">${esc(level(x))}</b></button>`).join('')||'<span style="color:#91a0af">没有 L2-L4 或缺失指标</span>';}
function selectedMetric(e){const metrics=metricRecords(e); const selected=metrics.find(m=>m.metric_id===state.metric)||lowMetrics(e)[0]||metrics[0]; state.metric=selected?.metric_id||null; return selected||{metric_id:'-',name:'暂无指标',status:'unavailable',reason:'没有评级记录'};}
function renderSelectedEvidence(){const e=current(); if(!e)return; const m=selectedMetric(e); const strip=document.getElementById('metricStrip'); const panel=document.getElementById('evidencePanel'); const label=document.getElementById('evidenceLabel'); if(strip){strip.innerHTML=metricStrip(e); strip.querySelectorAll('[data-metric]').forEach(b=>b.onclick=()=>{state.metric=b.dataset.metric; renderSelectedEvidence(); renderScore(e);});} if(label)label.textContent=m.status==='ok'?'正式数值 + 原始序列':'原始序列 / 证据状态'; if(panel){panel.innerHTML=renderEvidence(e,m);} bindChartToVideo();}
function updateVoteMetricVisibility(){const panel=document.getElementById('reviewVoting');if(!panel)return;const metricId=state.metric||state.auditMetric;const context=document.getElementById('voteMetricContext');const empty=document.getElementById('voteMetricEmpty');const cards=[...panel.querySelectorAll('.vote-item')];const visible=cards.filter(card=>{const ids=(card.dataset.metricIds||'').split(/\s+/).filter(Boolean);const show=Boolean(metricId)&&ids.includes(metricId);card.hidden=!show;return show;});const spec=PAYLOAD.metric_specs[metricId]||{};if(context)context.textContent=metricId?`${metricId} · ${spec.name||'当前指标'}：仅显示与该指标直接关联的超参。`:'';if(empty){empty.hidden=visible.length>0||!metricId;empty.textContent=metricId?`${metricId} 当前配置没有可投票的直接关联超参。`:'';}}
function renderScore(e){const list=document.getElementById('scoreList'); const rows=metricRecords(e); list.innerHTML=rows.map(m=>`<button class="score-row ${state.metric===m.metric_id?'active':''}" data-metric="${esc(m.metric_id)}"><span class="score-id">${esc(m.metric_id)}</span><span class="score-name"><strong>${esc(m.name||m.metric_id)}</strong><span>${m.status==='ok'?`值 ${fmt(m.value,4)} · ${esc(m.unit||'')}`:esc(m.reason||m.status)}</span></span><b class="score-badge ${levelClass(level(m))}">${esc(level(m))}</b></button>`).join('')||'<div class="score-empty">没有指标记录</div>'; list.querySelectorAll('.score-row').forEach(b=>b.onclick=()=>{state.metric=b.dataset.metric; renderSelectedEvidence(); renderScore(e);});updateVoteMetricVisibility();}
function bindChartToVideo(){const video=document.getElementById('episodeVideo'); if(!video)return; const update=()=>{const svg=document.querySelector('svg[data-chart="evidence"]'), playhead=svg?.querySelector('.evidence-playhead'); if(!svg||!playhead)return; const ratio=video.duration?Math.max(0,Math.min(1,video.currentTime/video.duration)):0; const x=44+ratio*(900-44-14); playhead.setAttribute('x1',x); playhead.setAttribute('x2',x);}; if(!video._evidenceVideoBound){video.addEventListener('timeupdate',update); video.addEventListener('loadedmetadata',update); video._evidenceVideoBound=true;} const svg=document.querySelector('svg[data-chart="evidence"]'); if(svg&&!svg.dataset.videoBound){svg.addEventListener('click',event=>{if(!video.duration)return; const rect=svg.getBoundingClientRect(); const ratio=Math.max(0,Math.min(1,(event.clientX-rect.left)/rect.width)); video.currentTime=ratio*video.duration; update();}); svg.dataset.videoBound='1';} update();}
function navigateAuditQueue(step){const rows=filteredEpisodes();if(!rows.length)return;const position=rows.indexOf(current());const next=rows[(position<0?0:position+step+rows.length)%rows.length];state.index=PAYLOAD.episodes.indexOf(next);state.metric=state.auditMetric||null;render();}
function renderMain(){const e=current(); if(!e)return; const m=selectedMetric(e); const main=document.getElementById('mainContent'); const audit=activeAuditMatches(e); const auditNote=audit.length?`<div class="evidence-note">审计命中：${esc(audit.map(auditText).join('；'))}</div>`:'';main.innerHTML=`<div class="episode-header"><div><div class="eyebrow">${esc(e.source||'eval')} · ${esc(e.split||'')}</div><h1>${esc(e.episode_id)}</h1><div class="task">${esc(e.task||'未提供任务指令')}</div>${auditNote}</div><div class="nav-buttons"><button class="icon-btn" id="prev" title="上一个 episode">←</button><button class="icon-btn" id="next" title="下一个 episode">→</button></div></div><div class="summary"><div class="stat"><div class="stat-label">总体评级</div><div class="stat-value ${levelClass(e.overall_level)}">${esc(e.overall_level||'-')}</div></div><div class="stat"><div class="stat-label">总体分数</div><div class="stat-value">${fmt(e.overall_score,1)}</div></div><div class="stat"><div class="stat-label">用途</div><div class="stat-value" style="font-size:16px">${esc(e.overall_use||'未定义')}</div></div><div class="stat"><div class="stat-label">低分 / 缺失项</div><div class="stat-value">${e.low_metrics.length}</div></div></div><div class="video-shell">${e.video_url?`<video id="episodeVideo" controls preload="none" poster="${esc(e.poster_url||'')}" src="${esc(e.video_url)}"></video>`:'<div style="padding:70px 20px;text-align:center;color:#91a0af">视频文件不可用</div>'}<div class="video-meta"><span>${e.evidence?.frame_count||'-'} frames · ${fmt(e.evidence?.duration,2)} s</span><span>${e.evidence?.columns?.length||0} evidence columns</span></div></div><div class="section-head"><h2>低分原因与可视化证据</h2></div><div id="metricStrip" class="metric-strip">${metricStrip(e)}</div><div class="section-head"><h2>证据视图</h2><span id="evidenceLabel">${esc(m.status==='ok'?'正式数值 + 原始序列':'原始序列 / 证据状态')}</span></div><div id="evidencePanel" class="evidence">${renderEvidence(e,m)}</div>`; document.getElementById('prev').onclick=()=>navigateAuditQueue(-1); document.getElementById('next').onclick=()=>navigateAuditQueue(1); main.querySelectorAll('#metricStrip [data-metric]').forEach(b=>b.onclick=()=>{state.metric=b.dataset.metric; renderSelectedEvidence(); renderScore(e);}); bindChartToVideo();}
async function render(){renderEpisodes();const summary=current();if(!summary)return;const token=++renderToken;renderLoading(summary);try{const detail=await loadEpisode(summary);if(token!==renderToken)return;PAYLOAD.episodes[state.index]=detail;renderMain();renderScore(detail);}catch(error){if(token!==renderToken)return;const main=document.getElementById('mainContent');if(main)main.innerHTML=`<div class="evidence-note bad">无法加载该 episode 的证据数据：${esc(error.message||error)}。</div>`;const scores=document.getElementById('scoreList');if(scores)scores.innerHTML='<div class="score-empty">评级矩阵不可用</div>';}}
document.getElementById('search').oninput=e=>{state.query=e.target.value; render();}; document.getElementById('levelFilter').onchange=e=>{state.filter=e.target.value; render();}; initializeAuditControls(); render();</script><script src="visibility.js"></script></body></html>
